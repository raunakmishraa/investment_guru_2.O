name: Apply mobile modal scroll fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wire modal scroll fix into homepage
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          css = '<link rel="stylesheet" href="css/modal-scroll-fix.css">'
          script = '<script src="js/modal-scroll-fix.js"></script>'

          if css not in text:
              text = text.replace('<link rel="stylesheet" href="css/style.css">', '<link rel="stylesheet" href="css/style.css">\n  ' + css, 1)
          if script not in text:
              text = text.replace('</body>', '  ' + script + '\n</body>', 1)

          path.write_text(text, encoding='utf-8')
      - name: Commit and clean up
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/apply-modal-scroll-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix mobile modal scrolling"
          git push
